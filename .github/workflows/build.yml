name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The APK is only compiled here as a check: a CI runner signs with a throwaway debug key,
      # which would block updating an installed copy. Ship the APK from a local build instead.
      - run: ./gradlew :shared:desktopTest :androidApp:testDebugUnitTest :androidApp:assembleDebug :desktopApp:packageDeb :desktopApp:createDistributable
      - run: tar -czf Wassertiger-linux-x86_64.tar.gz -C desktopApp/build/compose/binaries/main/app Wassertiger
      - uses: actions/upload-artifact@v4
        with:
          name: wassertiger-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: wassertiger-linux-tar
          path: Wassertiger-linux-x86_64.tar.gz
